<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="780" viewBox="0 0 1200 780" role="img" aria-labelledby="title desc"><title id="title">TechService — Diagrama de implantação — Iteração 1</title><desc id="desc">Navegador acessa por HTTPS o encaminhamento de porta do GitHub Codespaces. Um container Python executa Gunicorn e Flask e usa banco relacional SQLite local. GitHub armazena o código, mas não executa a aplicação.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#365c91"/></marker></defs><rect width="1200" height="780" fill="#f5f8fc"/><g font-family="Arial, sans-serif" fill="#172a45"><text x="50" y="55" font-size="28" font-weight="bold">TechService — Diagrama de implantação</text><text x="50" y="84" font-size="17" fill="#60738c">Primeira iteração da fase de construção • Ambiente de demonstração</text><rect x="390" y="125" width="760" height="505" rx="15" fill="#e9f1ff" stroke="#365c91" stroke-width="2"/><text x="420" y="161" font-size="18">«node» GitHub Codespaces — ambiente remoto</text><rect x="45" y="230" width="265" height="185" rx="12" fill="white" stroke="#365c91" stroke-width="2"/><text x="67" y="264" font-size="17">«device» Computador</text><text x="67" y="294" font-size="17">do funcionário</text><line x1="65" y1="314" x2="287" y2="314" stroke="#b0c1d7"/><text x="67" y="346" font-size="15">«executionEnvironment»</text><text x="67" y="376" font-size="21" font-weight="bold">Navegador web</text><rect x="435" y="200" width="665" height="112" rx="10" fill="white" stroke="#365c91" stroke-width="2"/><text x="460" y="229" font-size="16">«executionEnvironment» Encaminhamento de porta</text><text x="460" y="260" font-size="20" font-weight="bold">URL HTTPS externa → porta interna 8000</text><text x="460" y="288" font-size="15">Porta pública exige configuração pelo proprietário</text><path d="M 310 270 H 435" stroke="#365c91" stroke-width="2.5" marker-end="url(#arrow)" fill="none"/><text x="331" y="253" font-size="16">HTTPS</text><rect x="435" y="355" width="665" height="240" rx="10" fill="#f4fbf6" stroke="#448362" stroke-width="2"/><text x="458" y="387" font-size="17">«executionEnvironment» Container Python 3.12</text><rect x="460" y="425" width="330" height="130" rx="8" fill="white" stroke="#448362" stroke-width="2"/><text x="478" y="453" font-size="15">«executionEnvironment»</text><text x="478" y="482" font-size="22" font-weight="bold">Gunicorn / Flask</text><text x="478" y="513" font-size="15">«artifact» app.py, backend</text><text x="478" y="538" font-size="15">e templates HTML/CSS</text><rect x="875" y="425" width="200" height="130" rx="8" fill="white" stroke="#448362" stroke-width="2"/><text x="890" y="453" font-size="15">«artifact»</text><text x="890" y="483" font-size="17" font-weight="bold">techservice.sqlite3</text><text x="890" y="513" font-size="15">Banco relacional</text><text x="890" y="538" font-size="15">SQLite local</text><path d="M 625 312 V 425" stroke="#365c91" stroke-width="2.5" marker-end="url(#arrow)" fill="none"/><text x="640" y="342" font-size="14">HTTP :8000</text><path d="M 790 490 H 875" stroke="#365c91" stroke-width="2.5" marker-end="url(#arrow)" fill="none"/><text x="801" y="473" font-size="14">SQL</text><rect x="45" y="485" width="265" height="125" rx="12" fill="white" stroke="#365c91" stroke-width="2"/><text x="65" y="518" font-size="18">«node» GitHub</text><text x="65" y="550" font-size="16">«artifact» Repositório</text><text x="65" y="578" font-size="15">Código e documentação</text><path d="M 310 555 H 367 V 407 H 435" stroke="#365c91" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#arrow)" fill="none"/><text x="318" y="587" font-size="13">Código</text><text x="50" y="680" font-size="16">Figura 1 — Implantação prevista; confirmar o acesso após iniciar o Codespace.</text><text x="50" y="710" font-size="15" fill="#60738c">O site só fica disponível enquanto o ambiente estiver ativo. Excluir o ambiente apaga o banco.</text><text x="50" y="739" font-size="15" fill="#60738c">GitHub Pages não executa Flask. Codespaces é demonstração temporária, não hospedagem permanente.</text></g></svg>